<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление ноутбуком</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1e1e24;
            color: #ffffff;
            padding-top: 80px;
        }
        button {
            padding: 25px 50px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            border: none;
            background: #2ecc71; /* Зеленая кнопка */
            color: white;
            box-shadow: 0 4px 20px rgba(46, 204, 113, 0.4);
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        #status { margin-top: 30px; font-size: 20px; color: #a0a0a0; }
        #text { font-weight: bold; color: #4fc1ff; font-size: 24px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Голосовое управление</h1>
    <button id="start-btn">🎙️ Включить микрофон</button>
    <p id="status">Нажмите кнопку и скажите команду</p>
    <p id="text"></p>

    <script>
        // НАСТРОЙКА: Сюда впиши IP-адрес своего ноутбука
        const SERVER_IP = '192.168.3.106'; 
        const SERVER_PORT = '3000';

        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        const recognizedText = document.getElementById('text');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Браузер не поддерживает голос. Используйте Google Chrome.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;

            startBtn.addEventListener('click', () => {
                recognition.start();
                statusText.innerText = "Слушаю...";
                recognizedText.innerText = "";
            });

            recognition.onresult = (event) => {
                const phrase = event.results[0][0].transcript.toLowerCase();
                recognizedText.innerText = `Вы сказали: "${phrase}"`;
                
                // Проверка команды 1: Открыть VS Code
                if ((phrase.includes('открой') || phrase.includes('запусти')) && 
                    (phrase.includes('код') || phrase.includes('vs') || phrase.includes('вижуал'))) {
                    
                    sendTrigger('open-vscode');

                // Проверка команды 2: Спящий режим
                } else if (phrase.includes('спящий режим') || phrase.includes('усни') || phrase.includes('выключи')) {
                    
                    sendTrigger('sleep');

                } else {
                    statusText.innerText = "Команда не распознана. Попробуйте 'Открой VS Code' или 'Спящий режим'.";
                }
            };

            recognition.onerror = () => { statusText.innerText = "Ошибка доступа к микрофону."; };
            recognition.onend = () => { 
                if (statusText.innerText === "Слушаю...") {
                    statusText.innerText = "Нажмите кнопку и говорите";
                }
            };
        }

        // Универсальная функция отправки запросов
        function sendTrigger(endpoint) {
            statusText.innerText = "Отправляю сигнал на ноутбук...";
            
            fetch(`http://${SERVER_IP}:${SERVER_PORT}/${endpoint}`)
                .then(response => response.text())
                .then(data => {
                    statusText.innerText = "Готово! ПК ответил: " + data;
                })
                .catch(err => {
                    statusText.innerText = "Не удалось связаться с ноутбуком.";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
